
name: Release latest APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: false

jobs:
  release:
    name: Publish latest FOSS release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Validate signing secrets
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$ENCODED_KEYSTORE"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Decode release keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/keystore"
          mkdir -p "$KEYSTORE_DIR"

          KEYSTORE_PATH="${KEYSTORE_DIR}/sdmaid-foss-release.jks"

          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          echo "STORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Assemble signed FOSS release APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleFossRelease

      - name: Prepare APK
        id: apk
        run: |
          src="$(find app/build/outputs/apk/foss/release -name '*.apk' | head -n 1)"
          test -n "$src"

          cp "$src" sdmaid-se-foss-release.apk

          echo "path=sdmaid-se-foss-release.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub prerelease (tag latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest \
            --repo "${{ github.repository }}" \
            --yes --cleanup-tag 2>/dev/null || true

          gh release create latest \
            --repo "${{ github.repository }}" \
            --prerelease \
            --latest=false \
            --target "${{ github.sha }}" \
            --title "Latest FOSS release build" \
            --notes "Signed, optimised FOSS release APK from commit \`${{ github.sha }}\` (run ${{ github.run_number }})." \
            "${{ steps.apk.outputs.path }}"

